[build]
  command = "npm run build"
  publish = "dist"

# Old URLs → new SEO-friendly URLs
[[redirects]]
  from = "/primerasessio"
  to = "/sessio-diagnostica"
  status = 301

[[redirects]]
  from = "/individual"
  to = "/acompanyament-individual"
  status = 301

[[redirects]]
  from = "/recursos"
  to = "/recursos-gratuits"
  status = 301

[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# Unlisted workshop page (shared by link only, not indexed)
[[redirects]]
  from = "/taller-mares-i-filles"
  to = "/taller-mares-i-filles/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/taller-mares-i-filles/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
